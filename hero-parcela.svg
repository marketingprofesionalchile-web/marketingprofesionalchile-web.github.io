<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Paisaje de parcelas con colinas y camino" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3ff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd08a"/>
      <stop offset="1" stop-color="#7cbf6a"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ac77a"/>
      <stop offset="1" stop-color="#63ab55"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7d98f"/>
      <stop offset="1" stop-color="#88c66f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="640" cy="120" r="52" fill="#fff3c4" opacity="0.9"/>
  <circle cx="640" cy="120" r="72" fill="#fff3c4" opacity="0.35"/>
  <path d="M0 300 Q160 250 340 288 T800 270 V600 H0 Z" fill="url(#hill1)"/>
  <path d="M0 360 Q220 300 430 350 T800 335 V600 H0 Z" fill="url(#hill2)"/>
  <path d="M0 420 H800 V600 H0 Z" fill="url(#field)"/>
  <!-- Camino -->
  <path d="M360 600 Q400 480 470 430 Q520 396 560 380" stroke="#e7dcc2" stroke-width="46" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M360 600 Q400 480 470 430 Q520 396 560 380" stroke="#d8c9a5" stroke-width="46" fill="none" stroke-linecap="round" stroke-dasharray="2 40" opacity="0.5"/>
  <!-- Deslindes de parcelas (líneas) -->
  <g stroke="#5a9648" stroke-width="2.5" opacity="0.5">
    <path d="M120 470 L60 600"/>
    <path d="M240 452 L210 600"/>
    <path d="M620 452 L690 600"/>
    <path d="M720 470 L780 600"/>
    <path d="M60 520 H360"/>
    <path d="M560 505 H800"/>
  </g>
  <!-- Árboles -->
  <g>
    <ellipse cx="150" cy="360" rx="26" ry="34" fill="#4f9a45"/>
    <rect x="146" y="386" width="8" height="20" fill="#7c5a3a"/>
    <ellipse cx="700" cy="345" rx="30" ry="40" fill="#478a3f"/>
    <rect x="695" y="378" width="9" height="24" fill="#7c5a3a"/>
    <ellipse cx="90" cy="300" rx="20" ry="26" fill="#57a44b"/>
    <rect x="87" y="320" width="6" height="16" fill="#7c5a3a"/>
  </g>
</svg>
