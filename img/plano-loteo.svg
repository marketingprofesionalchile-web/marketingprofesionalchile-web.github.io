<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plano de loteo con divisiones de parcelas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e7d4f"/>
      <stop offset="0.55" stop-color="#256b42"/>
      <stop offset="1" stop-color="#1a4f30"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#land)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>
  <!-- Vías principales -->
  <g stroke="#d8cfae" stroke-opacity="0.55" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M-20 250 Q400 210 640 300 T1220 280"/>
    <path d="M470 -20 Q520 300 470 500 T560 820"/>
  </g>
  <!-- Divisiones de parcelas -->
  <g stroke="#eaf3ea" stroke-opacity="0.32" stroke-width="1.6" fill="none">
    <!-- bloque superior izquierdo -->
    <path d="M60 60 H430 V235 H60 Z"/>
    <path d="M152 60 V235 M244 60 V235 M336 60 V235"/>
    <path d="M60 148 H430"/>
    <!-- bloque superior derecho -->
    <path d="M660 70 H1140 V250 H660 Z"/>
    <path d="M780 70 V250 M900 70 V250 M1020 70 V250"/>
    <path d="M660 160 H1140"/>
    <!-- bloque inferior izquierdo -->
    <path d="M70 330 H420 V740 H70 Z"/>
    <path d="M70 440 H420 M70 550 H420 M70 645 H420"/>
    <path d="M245 330 V740"/>
    <!-- bloque inferior derecho -->
    <path d="M620 340 H1150 V730 H620 Z"/>
    <path d="M620 460 H1150 M620 580 H1150"/>
    <path d="M760 340 V730 M900 340 V730 M1030 340 V730"/>
  </g>
  <!-- Puntos de interés / lotes destacados -->
  <g fill="#b0894a" fill-opacity="0.9">
    <rect x="152" y="148" width="92" height="87" rx="3"/>
    <rect x="900" y="70" width="120" height="90" rx="3"/>
    <rect x="245" y="440" width="175" height="110" rx="3"/>
  </g>
</svg>
